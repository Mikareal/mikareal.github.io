<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=Orbitron:wght@400..900&family=Permanent+Marker&family=Righteous&family=Rubik+Glitch&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
  <title>M1kareal</title>
  <style>
    @font-face {
      font-family: 'randomfontsoitsnotlocal';
      src: url('fonts/randomfontsoitsnotlocal.woff2') format('woff2'),
           url('fonts/randomfontsoitsnotlocal.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      height: 100%;
      margin: 0;
      background-color: #0d111700;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('./media/bg.gif');
      background-size: cover;
      background-position: center center;
      transform: scale(1.03);
      filter: blur(6px) brightness(0.9);
      will-change: transform, filter;
      z-index: -1;
      pointer-events: none;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 20px;
    }

    #coming-soon {
      color: white;
      font-size: clamp(2rem, 10vw, 5rem);
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      user-select: none;
      text-transform: lowercase;
      height: 1.2em; /* Lock height to prevent jumping */
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .discord-link {
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .discord-link:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 15px rgba(255, 0, 212, 0.8));
    }

    .discord-icon {
      width: 48px;
      height: 48px;
      fill: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="coming-soon">coming soon...</div>
    <a href="https://discord.com/invite/VTgzJrdEsZ" class="discord-link" target="_blank" rel="noopener noreferrer">
      <svg class="discord-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07c-7.9-3.79-16.4-6.59-25.23-8.27a.44.44,0,0,0-.47.22,74.29,74.29,0,0,0-3.28,6.74,97.07,97.07,0,0,0-29.44,0,72.67,72.67,0,0,0-3.3-6.74.45.45,0,0,0-.47-.22A105.27,105.27,0,0,0,19.24,8.07a.47.47,0,0,0-.21.18C2.51,33.15-2,57.57.43,81.58a.48.48,0,0,0,.19.34A105.6,105.6,0,0,0,32.79,98.1a.48.48,0,0,0,.52-.17,74.62,74.62,0,0,0,6.72-10.9.45.45,0,0,0-.24-.62,68.42,68.42,0,0,1-10.62-5.07.47.47,0,0,1-.05-.78c.7-.53,1.43-1.07,2.11-1.63a.47.47,0,0,1,.48-.06,75.47,75.47,0,0,0,63.62,0,.48.48,0,0,1,.49.06c.68.56,1.41,1.1,2.11,1.63a.47.47,0,0,1-.05.78,68.42,68.42,0,0,1-10.62,5.07.45.45,0,0,0-.24.62,74.62,74.62,0,0,0,6.72,10.9.48.48,0,0,0,.52.17,105.6,105.6,0,0,0,32.17-16.18.48.48,0,0,0,.19-.34c2.85-28.05-4.73-52.22-19.49-73.33A.48.48,0,0,0,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5.09-12.73,11.41-12.73S53.84,46,53.84,53,48.75,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.33,60,73.33,53s5.09-12.73,11.41-12.73S96.15,46,96.15,53,91.06,65.69,84.69,65.69Z"/>
      </svg>
    </a>
  </div>

  <script>
    const fonts = [
      'Orbitron',
      'Righteous',
      '"Permanent Marker"',
      '"Rubik Glitch"',
      '"Metal Mania"',
      'Creepster',
      'Sedgwick Ave Display',
      'randomfontsoitsnotlocal'
    ];

    const textElement = document.getElementById('coming-soon');
    
    function changeFont() {
      const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
      textElement.style.fontFamily = randomFont;
    }

    // Change font every 150ms
    setInterval(changeFont, 150);
    
    // Initial call
    changeFont();
  </script>
</body>
</html>
